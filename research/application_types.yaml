field_definitions:
  can_file_concurrently: "Rationale: Tracking whether an applicant can submit their primary petition (e.g., I-130 or I-140) at the exact same time as their Green Card application (I-485). Being able to file concurrently drastically changes the legal strategy because it allows the applicant to apply for a work permit and travel authorization immediately, rather than waiting years."
  common_waivers_needed: "Rationale: Qualifying for a category is only step one; many applicants require an accompanying waiver (like an I-601A for unlawful presence or I-601 for fraud/misrepresentation) if they triggered inadmissibility. Tracking the most common waivers associated with each category helps anticipate timeline delays and extra legal steps."
  attorney_required_tasks: "Rationale: Highlights complex legal assessments, risk management, and procedural hurdles that legally or strategically require professional counsel to avoid permanent denial or removal."
  independent_sequential_checklist: "Rationale: Empowers the applicant with an actionable, chronological roadmap of administrative steps they can confidently handle themselves, reducing overhead and friction."

static_elements:
  header_title: FastGC
  header_description: "Your simple guide to secure and fast U.S. Green Card applications"
  body_title: "What is a Green Card?"
  body_description: "A green card lets you live and work in the United States permanently. To apply, you must qualify under at least one of the categories below. Find the one that fits your situation to learn how to apply and how to speed up the process."
  footer_disclaimer: |
    This information is based on official USCIS data and is for general information only — not legal advice. For your specific situation, consult a licensed immigration attorney.
    Source: USCIS Green Card Eligibility Categories

legal_rights_and_recent_policies:
  uscis_memo_may_2026:
    source_link: "https://www.uscis.gov/sites/default/files/document/memos/PM-602-0199-AdjustmentOfStatusAndDiscretion-20260521.pdf"
    simple_explanation: "On May 21, 2026, USCIS released a new rule (Memo PM-602-0199). It tells immigration officers to treat getting a green card inside the U.S. as a special privilege, not an automatic right. Officers now have more power to say no."
    key_impacts:
      - "Stricter Reviews: Meeting the basic rules is no longer enough. Officers will look at your whole life history and can deny your application just because they think you don't deserve the privilege."
      - "Zero Tolerance for Mistakes: Officers will be very strict if you ever worked without permission or stayed past your visa expiration date."
      - "High Risk for Tourists and Students: People on student (F-1) or tourist (B-2) visas are at high risk. Applying for a green card goes against the temporary nature of these visas, which officers can now use as a reason for denial."
      - "Work Visas are Safer, but not Immune: People on work visas (like H-1B or L-1) are safer because those visas legally allow you to want a green card. But even then, any past mistakes can still lead to a denial."
      - "Who is Safe: This strict rule does not apply to refugees, asylees, or victims of abuse and crime (like VAWA, U, T, or SIJ visa applicants)."

  ice_and_cbp_powers:
    simple_explanation: "Immigration and Customs Enforcement (ICE) and Customs and Border Protection (CBP) have a lot of power to enforce immigration laws, but the U.S. Constitution (specifically the 4th and 5th Amendments) strictly limits what they can do."
    what_they_can_legally_do:
      - action: "The 100-Mile Zone"
        explanation: "Within 100 air miles of any U.S. border or coastline, Border Patrol can legally board and search buses, trains, and ships."
        legal_source: "8 U.S. Code § 1357 (https://www.law.cornell.edu/uscode/text/8/1357)"
      - action: "Permanent Checkpoints"
        explanation: "They can set up permanent checkpoints within this 100-mile zone and briefly stop cars to ask about citizenship without needing a specific reason."
        legal_source: "United States v. Martinez-Fuerte, 1976 (https://supreme.justia.com/cases/federal/us/428/543/)"
      - action: "Roving Patrols (Driving Around)"
        explanation: "If agents are driving around, they can only pull your car over if they have a 'reasonable suspicion' (a specific, provable reason) to think you are breaking an immigration law."
        legal_source: "United States v. Brignoni-Ponce, 1975 (https://supreme.justia.com/cases/federal/us/422/873/)"
      - action: "Public Arrests"
        explanation: "ICE agents can arrest people in public places if they have an official agency paper called an administrative warrant (Form I-200 or I-205)."
        legal_source: "Immigration and Nationality Act (INA) Section 287"
    what_they_cannot_do_where_they_break_the_law:
      - limitation: "Entering Your Home Without Permission"
        explanation: "They CANNOT enter your private home without your permission UNLESS they have a criminal warrant signed by a real judge. An ICE administrative warrant does NOT give them the right to force their way in. Forcing entry breaks the 4th Amendment."
        legal_source: "Fourth Amendment to the U.S. Constitution (https://constitution.congress.gov/constitution/amendment-4/)"
      - limitation: "Holding You Too Long at a Checkpoint"
        explanation: "They CANNOT keep you stopped at a checkpoint for a long time just to investigate your status unless they strongly suspect you of a crime. A stop must be brief."
        legal_source: "Rodriguez v. United States, 2015 (https://supreme.justia.com/cases/federal/us/575/13-9972/)"
      - limitation: "Searching Your Car Without Proof"
        explanation: "They CANNOT search the inside of your car without your permission or without strong proof (probable cause) that you are hiding something illegal."
        legal_source: "Almeida-Sanchez v. United States, 1973 (https://supreme.justia.com/cases/federal/us/413/266/)"
      - limitation: "Arresting You Just for Staying Silent"
        explanation: "You have the right to stay silent under the 5th Amendment. They CANNOT legally arrest you or search you just because you refuse to answer questions about where you were born or your citizenship status."
        legal_source: "Fifth Amendment to the U.S. Constitution (https://constitution.congress.gov/constitution/amendment-5/)"

travel_safety_and_documentation:
  general_risk_assessment: "International travel while an immigration application is pending carries distinct legal risks. Admission back into the U.S. is never guaranteed, and Customs and Border Protection (CBP) makes the final determination at the Port of Entry."
  domestic_travel_within_the_us:
    real_id_requirement: "As of May 7, 2025, the federal government requires all individuals 18 and older to present a REAL ID-compliant driver's license or another federally acceptable form of ID to board domestic commercial flights. Standard state licenses marked 'Federal Limits Apply' or 'Not for Federal Identification' are no longer accepted at TSA checkpoints."
    tsa_acceptable_alternatives: "If an applicant cannot obtain a REAL ID due to their pending status, the TSA explicitly accepts unexpired foreign passports and unexpired Employment Authorization Documents (EAD cards / Form I-766) as valid primary identification for domestic flights."
    cbp_presence_at_domestic_airports: "Many major domestic airports (e.g., in Texas, California, Florida, and upstate New York) fall within the 100-mile border zone. CBP agents frequently conduct internal checkpoints or roving operations at these domestic terminals. TSA agents are also authorized to refer individuals to CBP if they suspect an immigration violation during routine ID checks."
    traveling_with_a_pending_application: "Domestic flights do not require an Advance Parole document (Form I-131) because the applicant is not leaving the United States. However, anyone flying domestically with a pending Adjustment of Status (I-485) should always carry their original I-797C Notice of Action receipt. If stopped by CBP, this receipt proves the traveler has an authorized period of stay."
    risk_for_undocumented_individuals: "For individuals without legal status or a pending application, domestic air travel is extremely high risk. Using a foreign passport as TSA identification often triggers additional scrutiny, and encountering CBP at a domestic terminal can lead directly to detention and removal proceedings."
  travel_by_status:
    - status: "Pending I-485 (Adjustment of Status) - General"
      safety_level: "High Risk if unprepared"
      rule: "Leaving the U.S. without an approved Advance Parole document (Form I-131) generally results in the abandonment and denial of the I-485 application."
    - status: "Pending I-485 with Valid H-1B or L-1 Status"
      safety_level: "Generally Safe"
      rule: "H-1B and L-1 are dual-intent visas. Holders can travel and re-enter using their valid visa stamp without needing Advance Parole and without abandoning their green card application."
    - status: "Refugees and Asylees"
      safety_level: "Highly Restricted"
      rule: "Travel to the country of feared persecution can be viewed as 're-availment' of that country's protection, risking the termination of refugee/asylee status. Must travel using a Refugee Travel Document."
    - status: "Individuals with Past Unlawful Presence or Criminal History"
      safety_level: "Unsafe"
      rule: "Even with approved Advance Parole, departing the U.S. can trigger inadmissibility bars or subject the traveler to intense scrutiny and potential denial of entry by CBP."
  required_travel_documents:
    - "A valid, unexpired passport from your country of citizenship."
    - "A valid, unexpired Advance Parole Document (Form I-512) OR a valid dual-intent visa stamp (H-1B, L-1)."
    - "The original Form I-797C Notice of Action receipt for the pending I-485 application."
    - "For employment-based applicants: Recent pay stubs and a current employment verification letter."
    - "If applicable, original marriage or civil documents tying the derivative applicant to the primary sponsor."

application_types:
  - name: "Green Card through Family"
    simple_description: "You may qualify through a family member who is a U.S. citizen or a green card holder."
    explanation: "This category allows U.S. citizens and lawful permanent residents to sponsor certain family members for a green card. Immediate relatives of U.S. citizens have special priority and do not have to wait for a visa number. Family preference categories, however, are subject to annual numerical limits and often face significant wait times. This remains the most common pathway for family reunification in the U.S. immigration system."
    applicants:
      - who_you_can_apply_as: "Immediate relative of a U.S. citizen"
        who_you_need_to_be: "The husband or wife of a U.S. citizen; OR a child (unmarried, under 21) of a U.S. citizen; OR a parent of a U.S. citizen who is at least 21 years old."
      - who_you_can_apply_as: "Other family member (preference categories)"
        who_you_need_to_be: "An unmarried adult son or daughter of a U.S. citizen; OR a married son or daughter of a U.S. citizen; OR a brother or sister of a U.S. citizen (citizen must be at least 21); OR the husband or wife of a green card holder; OR an unmarried child (under 21) of a green card holder; OR an unmarried adult son or daughter of a green card holder."
      - who_you_can_apply_as: "Fiancé(e) of a U.S. citizen or their child"
        who_you_need_to_be: "Someone who entered the U.S. on a K-1 visa to marry a U.S. citizen; OR a child who entered on a K-2 visa as the child of a K-1 fiancé(e)"
      - who_you_can_apply_as: "Widow or widower of a U.S. citizen"
        who_you_need_to_be: "Someone whose U.S. citizen spouse died, and who was legally married to that person when they died"
      - who_you_can_apply_as: "VAWA self-petitioner (abuse victim)"
        who_you_need_to_be: "An abused husband or wife of a U.S. citizen or green card holder; OR an abused unmarried child (under 21) of a U.S. citizen or green card holder; OR an abused parent of a U.S. citizen."
    target_timeline: "10-14 months for immediate relatives of U.S. citizens. 2 to 20+ years for family preference categories, depending on the priority date."
    attorney_required_tasks:
      - "Analyzing previous unlawful presence, visa overstays, or entries without inspection to determine waiver eligibility."
      - "Drafting and filing Form I-601 or I-601A waivers for fraud, misrepresentation, or criminal history."
      - "Representing the couple at a split 'Stokes Interview' if USCIS suspects marriage fraud."
      - "Responding to complex Requests for Evidence (RFEs) challenging the legitimacy of a marriage or financial self-sufficiency."
    independent_sequential_checklist:
      - step: 1
        task: "Gather foundational civil documents (birth certificates, marriage licenses, divorce decrees)."
        form_link: "N/A"
        timeline_notes: "Complete within 1–2 weeks."
      - step: 2
        task: "Sponsor files Form I-130 (Petition for Alien Relative) online."
        form_link: "https://www.uscis.gov/i-130"
        timeline_notes: "Takes 1–2 hours to submit online; priority date established immediately."
      - step: 3
        task: "Applicant prepares Form I-485 (Adjustment of Status) packet for paper mailing."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Can be filed concurrently with Step 2 for immediate relatives."
      - step: 4
        task: "Sponsor completes Form I-864 (Affidavit of Support) and pulls certified IRS tax transcripts."
        form_link: "https://www.uscis.gov/i-864"
        timeline_notes: "Must accompany the Form I-485 packet."
      - step: 5
        task: "Schedule and undergo a medical examination with a USCIS-designated civil surgeon to complete Form I-693."
        form_link: "https://www.uscis.gov/i-693"
        timeline_notes: "Schedule 2 weeks before mailing packet to ensure signed, sealed results are enclosed."
    steps:
      - "Step 1: Sponsor files Form I-130, Petition for Alien Relative."
      - "Step 2: If inside the U.S. and eligible, applicant files Form I-485, Adjustment of Status (can be concurrent with I-130 for immediate relatives)."
      - "Step 3: If outside the U.S., case goes to the National Visa Center (NVC) for consular processing once I-130 is approved and a visa is available."
      - "Step 4: Attend biometrics appointment."
      - "Step 5: Attend green card interview at a USCIS office or U.S. Embassy/Consulate."
      - "Step 6: Receive decision and subsequent Green Card."
    action_items:
      - "Confirm the sponsor's U.S. citizenship or lawful permanent resident status with original certificates."
      - "Obtain certified copies of civil documents establishing the relationship (e.g., marriage certificates, birth certificates)."
      - "Spouse/Sponsor: Must complete Form I-864 (Affidavit of Support) and provide recent tax returns to prove financial ability."
      - "Pay filing fees: $675 for online I-130 (or $680 paper), $1,440 for I-485."
      - "Complete a medical examination by a USCIS-approved civil surgeon (Form I-693)."
    country_specific_info: "Applicants from Mexico, India, mainland China, and the Philippines generally face much longer wait times in the family preference categories due to per-country visa limits. Immediate relatives of U.S. citizens are not affected by these caps."
    communication_templates:
      - recipient: "USCIS"
        when_to_send: "If the application falls outside normal processing times."
        template: |
          Subject: Outside Normal Processing Time Inquiry - Receipt Number [Insert Receipt Number]
          Dear USCIS Officer,
          I am writing to inquire about the status of my Form I-130 / I-485, Receipt Number [Receipt Number]. According to the current processing times published on the USCIS website, my case is now outside the normal processing window. Please let me know if any additional information is needed to continue processing my case.
          Sincerely,
          [Your Name]
          [Your A-Number, if applicable]
    prevention_suggestions:
      - "Ensure the Form I-864 Affidavit of Support is meticulously completed with current tax transcripts; this is the most common reason for a Request for Evidence (RFE)."
      - "Submit Form I-693 (Medical Exam) along with the initial I-485 filing to avoid an RFE later in the process."
    can_file_concurrently: "Yes, for Immediate Relatives of U.S. Citizens. No, for Family Preference categories (unless their priority date is current on the Visa Bulletin)."
    common_waivers_needed: "I-601A (Provisional Unlawful Presence Waiver) is very common for applicants who entered without inspection and must process abroad. I-601 (Waiver of Grounds of Inadmissibility) for fraud or criminal issues."
    interview_preparation:
      - "Bring originals AND photocopies of all civil documents (marriage certificate, birth certificates, passports) — the officer will review originals and keep the copies."
      - "For spousal cases, be prepared to answer questions about your relationship history: how you met, your first date, your spouse's family members, daily routines, and shared finances. Practice with your spouse so your accounts are consistent."
      - "Dress professionally, arrive 30 minutes early, and bring the USCIS appointment notice, a government-issued photo ID, and all previously submitted documents in an organized binder."
      - "If applying as an immediate relative, the petitioning sponsor may be summoned to attend — confirm this in advance and prepare them for questions about their finances and the relationship."
      - "Inconsistencies between spouses are the #1 reason for fraud investigations; review your I-130 petition and I-485 together before the interview so your answers align perfectly."
    acceleration_tips:
      - "For immediate relatives, file the I-130 and I-485 together (concurrent filing) — this is the single biggest time-saver and immediately triggers work permit and travel authorization eligibility."
      - "File I-765 (Employment Authorization) and I-131 (Advance Parole) concurrently with the I-485 at no additional filing fee — this avoids a second round of processing."
      - "Use USCIS's online filing portal when available; online applications are routed to processing queues faster than paper filings."
      - "If your case exceeds the published processing time by even one day, submit a case inquiry e-request on the USCIS website — it can trigger an officer review without the delay of a formal inquiry letter."
      - "Include a tabbed, indexed cover letter listing every enclosed document; disorganized packets are set aside, while well-organized ones move through intake faster."
    critical_warnings:
      - "Unlawful presence bars: If you stayed in the U.S. past your visa or stay period and then leave, you may trigger a 3-year bar (unlawful presence 180 days–1 year) or a 10-year bar (unlawful presence over 1 year). Do NOT leave the U.S. to attend a consular interview without first consulting an immigration attorney — you could be barred from returning."
      - "Conditional green card deadline: If you have been married less than 2 years when your green card is approved, you receive a 2-year conditional green card. You MUST file Form I-751 to remove the conditions within the 90-day window before it expires. Missing this deadline will terminate your permanent resident status automatically."
    what_comes_next:
      - "Conditional green card holders: File Form I-751 (Petition to Remove Conditions on Residence) jointly with your spouse during the 90-day window before your 2-year green card expires. If the marriage ended, you can file alone with a waiver."
      - "Naturalization: You can apply for U.S. citizenship 3 years after getting your green card if you are still married to and living with your U.S. citizen spouse, or 5 years for all other green card holders. File Form N-400."
      - "Re-entry permit: If you plan to travel outside the U.S. for more than 6 months, apply for a re-entry permit (Form I-131) before departing. Absences over 1 year without a permit are generally considered abandonment of permanent residence."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card through Employment"
    simple_description: "You may qualify because of your job skills, education, or investment in the U.S. economy."
    explanation: "This pathway is for foreign nationals seeking permanent residence based on their job skills, education, or investment. It is divided into five preference categories (EB-1 through EB-5). Most employment categories require a U.S. employer to sponsor the applicant and obtain a labor certification. Self-petitioning is only available for specific EB-1, National Interest Waiver (EB-2), and EB-5 categories."
    applicants:
      - who_you_can_apply_as: "Immigrant worker — Priority (EB-1)" 
        who_you_need_to_be: "Someone with extraordinary ability in science, arts, education, business, or sports; OR an outstanding professor or researcher; OR a top-level manager or executive at a multinational company"
      - who_you_can_apply_as: "Immigrant worker — Advanced degree or exceptional ability (EB-2)"
        who_you_need_to_be: "Someone whose job requires an advanced degree (master's or higher); OR someone with exceptional ability in science, arts, or business; OR a person seeking a national interest waiver (your work greatly benefits the U.S.)"
      - who_you_can_apply_as: "Immigrant worker — Skilled, professional, or unskilled (EB-3)"
        who_you_need_to_be: "A skilled worker (job requires at least 2 years of training or experience); OR a professional (job requires at least a 4-year U.S. bachelor's degree); OR an unskilled worker (job requires less than 2 years of training)"
      - who_you_can_apply_as: "Physician National Interest Waiver"
        who_you_need_to_be: "A doctor who agrees to work full-time in a medically underserved area in the U.S. for a set period of time"
      - who_you_can_apply_as: "Immigrant investor (EB-5)"
        who_you_need_to_be: "Someone who has invested (or is in the process of investing) at least $1,050,000 in a new U.S. business that creates full-time jobs for at least 10 workers (investment can be $800,000 if the business is in a low-employment or rural area)"
    target_timeline: "1.5 to 3 years for most categories if priority date is current. Can exceed 10+ years for applicants from backlogged countries."
    attorney_required_tasks:
      - "Drafting the ETA Form 9089 and managing structural recruitment compliance for the DOL PERM process."
      - "Structuring complex corporate financial arguments to demonstrate the employer's ongoing 'ability to pay' the proffered wage."
      - "Formulating the narrative legal briefs required to secure an EB-2 National Interest Waiver (NIW) or EB-1 extraordinary capability petition."
      - "Reviewing job profiles under AC21 portability guidelines to ensure a new job is legally 'same or similar.'"
    independent_sequential_checklist:
      - step: 1
        task: "Secure official, detailed employment verification letters from all previous employers matching resume qualifications."
        form_link: "N/A"
        timeline_notes: "Allow 2–4 weeks; do this during the early recruitment phase."
      - step: 2
        task: "Obtain a certified evaluation of foreign academic degrees to prove U.S. equivalence."
        form_link: "N/A"
        timeline_notes: "Takes 1–2 weeks via NACES-approved services."
      - step: 3
        task: "Track the monthly Department of State Visa Bulletin to monitor priority date progression."
        form_link: "https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html"
        timeline_notes: "Check around the 15th of every month."
      - step: 4
        task: "Prepare Form I-485 Adjustment of Status paperwork once the priority date is verified as current."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Can be ready to mail on day 1 of the active target month."
      - step: 5
        task: "Obtain an updated, signed Form I-485 Supplement J from your sponsoring employer's HR division."
        form_link: "https://www.uscis.gov/i-485supplementj"
        timeline_notes: "Must be signed close to the date of I-485 filing or in response to a final RFE."
    steps:
      - "Step 1: Employer obtains Prevailing Wage Determination and conducts recruitment (if PERM Labor Certification is required)."
      - "Step 2: Employer files PERM Labor Certification with the Department of Labor."
      - "Step 3: Employer files Form I-140, Immigrant Petition for Alien Worker."
      - "Step 4: Applicant files Form I-485 when the priority date becomes current."
      - "Step 5: Attend biometrics and, if scheduled, an interview."
    action_items:
      - "Confirm applicant's educational credentials and secure foreign degree evaluations if necessary."
      - "Employer: Gather corporate tax returns to demonstrate the ability to pay the proffered wage from the priority date onward."
      - "Pay filing fees: $715 for I-140, $1,440 for I-485. Optional $2,805 for Premium Processing of I-140."
      - "Obtain employment verification letters from previous employers to prove required experience."
    country_specific_info: "Severe retrogression exists for Indian and Chinese nationals in the EB-2 and EB-3 categories. Wait times for these individuals can stretch over a decade."
    communication_templates:
      - recipient: "Employer's HR or Immigration Counsel"
        when_to_send: "Before the priority date becomes current, to prepare for I-485 filing."
        template: |
          Subject: Preparation for Adjustment of Status (I-485) Filing
          Dear [Name],
          I have been monitoring the monthly Visa Bulletin, and my priority date of [Date] is approaching the current cut-off date for my category. I would like to proactively gather the required documents (medical exam, birth certificates, etc.) for my Form I-485 filing. Could you please provide a checklist so we can file as soon as the date is current?
          Thank you,
          [Your Name]
    prevention_suggestions:
      - "Maintain valid nonimmigrant status (e.g., H-1B, L-1) throughout the process to ensure eligibility for Adjustment of Status."
      - "If changing employers after filing I-485, ensure the new job falls under the 'same or similar' occupational classification to invoke AC21 portability."
    can_file_concurrently: "Yes, if the priority date is current under the Final Action Dates or Dates for Filing chart (depending on USCIS's monthly determination). Not possible if the category is backlogged."
    common_waivers_needed: "Waivers are less common here. I-601 for fraud or criminal issues, but unlawful presence waivers (I-601A) are extremely difficult to use since employment-based applicants usually require maintaining lawful status."
    interview_preparation:
      - "Most EB-1, EB-2, and EB-3 I-485 cases are interview-waived; if an interview is scheduled, it typically signals a complication such as a prior status violation, inconsistency in the record, or a security check — treat it seriously."
      - "Bring all I-140 approval notices, complete visa history (all passports including expired), I-94 records, and the original job offer letter to prove the employment relationship is genuine."
      - "Be ready to clearly explain your job duties and how they match the PERM job description. If invoking AC21 portability, know both your original and new job titles, duties, and salary."
      - "Bring employer tax returns and your pay stubs to demonstrate the sponsoring employer has been paying (or can pay) the proffered wage from the priority date onward."
    acceleration_tips:
      - "File Premium Processing (Form I-907, $2,805) on the I-140 — it guarantees a 15-business-day adjudication and locks in your priority date months sooner."
      - "File the I-485 using the 'Dates for Filing' chart (when USCIS makes it available) rather than waiting for 'Final Action Dates' — this can allow filing months or even years earlier."
      - "Start PERM labor certification as early as possible in the employment relationship; PERM currently averages 12–18 months at the DOL and cannot be expedited."
      - "Indian and Chinese nationals in EB-3 should evaluate whether EB-1C (multinational manager/executive) or EB-2 NIW (National Interest Waiver) is achievable — these often have shorter wait times."
      - "Keep meticulous records of every H-1B or L-1 extension and approval; even a single day of status gap can create inadmissibility issues that derail the I-485."
    critical_warnings:
      - "AC21 job change risk: If you change employers after your I-485 has been pending for 180+ days, you may use AC21 portability — but the new job MUST be in the 'same or similar' occupational category. Get an attorney to confirm this in writing before accepting any new offer."
      - "Status gap is fatal: Even a single day of unlawful presence while an employment-based I-485 is pending can be disqualifying. Never let your H-1B, L-1, or other nonimmigrant status lapse — always file renewal extensions at least 6 months before expiration."
      - "I-140 revocation: If your employer withdraws the I-140 petition before it has been approved for at least 180 days, your priority date is lost. Once it reaches the 180-day mark, the I-140 survives even if the employer withdraws it — but only if you already filed the I-485."
    what_comes_next:
      - "Naturalization: Apply for U.S. citizenship 5 years after your green card was granted by filing Form N-400."
      - "Re-entry permit: Apply for a re-entry permit (Form I-131) before any international trip exceeding 6 months to protect your permanent resident status."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card as a Special Immigrant"
    simple_description: "Certain groups of people have their own special path to a green card."
    explanation: "This category covers specialized groups, including religious workers, Special Immigrant Juveniles (SIJ), and Afghan or Iraqi nationals who assisted the U.S. government. Each sub-group has highly specific eligibility requirements. It operates under the fourth employment preference (EB-4) category."
    applicants:
      - who_you_can_apply_as: "Religious worker"	
        who_you_need_to_be: "A minister or other religious worker who is coming to the U.S. to work for a nonprofit religious organization"
      - who_you_can_apply_as: "Special Immigrant Juvenile"
        who_you_need_to_be: "A young person (under 21) who was abused, abandoned, or neglected by a parent, and who has a court order protecting them"
      - who_you_can_apply_as: "Afghan or Iraqi national"
        who_you_need_to_be: "An Afghan or Iraqi person who worked as a translator or interpreter for the U.S. government; OR an Iraqi person who worked for the U.S. government in Iraq for at least 1 year after March 20, 2003; OR an Afghan person who worked for the U.S. government or NATO forces (ISAF)"
      - who_you_can_apply_as: "International broadcaster"
        who_you_need_to_be: "Someone coming to the U.S. to work in media for the U.S. Agency for Global Media (USAGM) or a USAGM partner organization"
      - who_you_can_apply_as: "International organization or NATO employee (or their family)"
        who_you_need_to_be: "A retired officer or employee of a qualifying international organization or NATO; OR an eligible family member of such a person"
    target_timeline: "1 to 3 years, depending on the specific sub-category and EB-4 visa availability."
    attorney_required_tasks:
      - "Navigating state juvenile courts to litigate and capture explicit, legally sound SIJ predicate findings."
      - "Assembling regulatory compliance briefs for religious institutions to survive unannounced USCIS site evaluations."
      - "Drafting custom requests for human development or state-level administrative relief to override structural visa limits."
    independent_sequential_checklist:
      - step: 1
        task: "Obtain formal certified copies of the underlying state court decree or military mission verification letters."
        form_link: "N/A"
        timeline_notes: "Allow 1–3 weeks depending on the administrative clerk or office."
      - step: 2
        task: "Prepare and file Form I-360 with specific supplemental records linked to the sub-category."
        form_link: "https://www.uscis.gov/i-360"
        timeline_notes: "Filing fees are frequently exempted for SIJ and Iraqi/Afghan operational personnel."
      - step: 3
        task: "Track priority numbers via the monthly Visa Bulletin under the Employment Fourth (EB-4) tier."
        form_link: "https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html"
        timeline_notes: "Review monthly to identify file windows."
      - step: 4
        task: "File Form I-485 packet once priority windows unlock."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Incorporate fee exemption confirmations if structurally supported by your category."
    steps:
      - "Step 1: File Form I-360, Petition for Amerasian, Widow(er), or Special Immigrant."
      - "Step 2: Obtain approval of the I-360 petition."
      - "Step 3: File Form I-485 to adjust status or proceed via consular processing."
      - "Step 4: Attend biometrics and final interview."
    action_items:
      - "Verify specific category requirements (e.g., SIJs need a qualifying state juvenile court order prior to filing)."
      - "Gather specialized evidence (e.g., proof of non-profit status for religious organizations, or U.S. military employment letters for translators)."
      - "Confirm fee exemptions, as many Special Immigrant categories (like SIJ or Afghan/Iraqi translators) do not pay standard filing fees."
    country_specific_info: "The EB-4 category has faced broader backlogs recently affecting applicants globally, particularly from El Salvador, Guatemala, Honduras, and Mexico."
    communication_templates:
      - recipient: "State Juvenile Court (for SIJ applicants)"
        when_to_send: "To initiate the state court proceedings before the applicant turns 18 or 21 (depending on state law)."
        template: |
          Subject: Petition for Predicate Order for Special Immigrant Juvenile Status
          Dear Honorable Court,
          We are filing the attached petition seeking a predicate order declaring that [Child's Name] is dependent on the court and that reunification with one or both parents is not viable due to abuse, neglect, or abandonment. This order is a time-sensitive prerequisite for federal immigration relief.
          Respectfully,
          [Your Name/Attorney]
    prevention_suggestions:
      - "For SIJs, age-out rules are extremely strict; ensure the I-360 is filed before the applicant's 21st birthday."
      - "For religious workers, the sponsoring organization must have its R-1/EB-4 tax-exempt documentation meticulously prepared to avoid fraud investigations."
    can_file_concurrently: "Generally No for SIJ (unless a visa is immediately available, which is rare due to EB-4 backlogs). Sometimes Yes for Religious Workers if the priority date is current."
    common_waivers_needed: "I-601 is commonly used for SIJ applicants to waive various inadmissibilities (like unlawful entry or minor juvenile infractions) using the generous SIJ-specific waiver standard."
    interview_preparation:
      - "Religious worker (EB-4) cases are frequently interviewed; the officer will scrutinize both the organization's legitimacy and the genuineness of your ministerial role — be prepared to discuss your theology, specific religious duties, congregation size, and compensation structure."
      - "For SIJ applicants, the USCIS interview focuses on the state court findings; bring a certified copy of the juvenile court order and be ready to explain the facts of abuse, abandonment, or neglect calmly and consistently with the court record."
      - "Afghan and Iraqi translator applicants should bring original military or government employment records, unit reference letters, and any security clearance documentation they are permitted to share."
    acceleration_tips:
      - "For SIJ applicants, file the I-360 immediately upon obtaining the state court predicate order — the priority date is set at filing, not when evidence is complete."
      - "Religious organizations should have a detailed organizational chart, three years of financial statements, and proof of IRS 501(c)(3) tax-exempt status ready before filing I-360 — these documents prevent the most common RFEs."
      - "Afghan and Iraqi translator applicants can request expedited processing from USCIS on humanitarian grounds; document any ongoing personal safety threats in writing when making the request."
    critical_warnings:
      - "SIJ age-out: For Special Immigrant Juveniles, the I-360 petition MUST be filed before the applicant turns 21. Once they turn 21, this pathway closes permanently — even if a qualifying state court order was obtained earlier."
      - "Religious worker program sunset: The non-minister special religious worker (EB-4) visa category has required periodic Congressional reauthorization and has lapsed before. Always verify current program authorization status with an attorney before beginning an EB-4 religious worker petition."
    what_comes_next:
      - "Naturalization: Apply for U.S. citizenship 5 years after becoming a lawful permanent resident by filing Form N-400."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card through Refugee or Asylee Status"
    simple_description: "If you came to the U.S. as a refugee or were granted asylum, you can apply for a green card after one year."
    explanation: "Foreign nationals admitted to the U.S. as refugees or granted asylum are required (refugees) or eligible (asylees) to apply for a green card after one year of physical presence in the United States. This category provides a permanent safe haven for those who fled persecution. Derivatives (spouses and children) granted status along with the principal can also adjust."
    applicants:
      - who_you_can_apply_as: "Asylee"
        who_you_need_to_be: "Someone who was granted asylum in the U.S. at least 1 year ago"
      - who_you_can_apply_as: "Refugee"
        who_you_need_to_be: "Someone who entered the U.S. as a refugee at least 1 year ago"
    target_timeline: "1.5 to 2.5 years for the I-485 application to be processed, depending heavily on security background checks."
    attorney_required_tasks:
      - "Evaluating and legally navigating risk parameters if an applicant holds travel history that points to 're-availment' of protection from the home country."
      - "Preparing complex Form I-602 waivers to overcome criminal items, health exclusions, or historical status irregularities."
      - "Drafting federal Writ of Mandamus lawsuits if background security clear screens remain locked for years without justification."
    independent_sequential_checklist:
      - step: 1
        task: "Pull absolute historical I-94 travel history files online to explicitly calculate and confirm 365 days of physical presence."
        form_link: "https://i94.cbp.dhs.gov/"
        timeline_notes: "Execute immediately upon crossing the 1-year asylum/refugee grant threshold."
      - step: 2
        task: "Complete the master Form I-485 application layout."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Refugees enjoy a $0 statutory processing rate; Asylees must incorporate the standard $1,440 fee or present a fee waiver."
      - step: 3
        task: "Evaluate eligibility thresholds for low-income profiles and prepare Form I-912 if requesting a full fee waiver."
        form_link: "https://www.uscis.gov/i-912"
        timeline_notes: "Must be bundled and attached directly over the root Form I-485 page."
      - step: 4
        task: "Secure official baseline processing documentation, including copy packets of the original Asylum Approval Letter or immigration judge ruling records."
        form_link: "N/A"
        timeline_notes: "Allow 1 week to locate and print clear photocopies."
    steps:
      - "Step 1: Accumulate one year of physical presence in the U.S. after being admitted as a refugee or granted asylum."
      - "Step 2: File Form I-485, Application to Register Permanent Residence."
      - "Step 3: Attend biometrics appointment."
      - "Step 4: Complete the medical exam (Form I-693)."
    action_items:
      - "Confirm one full year of physical presence; track all international travel after being granted status."
      - "Obtain proof of asylee or refugee status (e.g., I-94, Asylum approval letter, or Immigration Judge order)."
      - "Refugees: Pay no fee for the I-485 application. Asylees: Pay the $1,440 fee or submit a fee waiver (Form I-912)."
    country_specific_info: "There are no per-country visa caps for asylees and refugees adjusting status. However, background checks can sometimes cause delays for applicants from regions with complex security concerns."
    communication_templates:
      - recipient: "USCIS"
        when_to_send: "If an I-485 has been pending for an extensively long time, often due to security checks."
        template: |
          Subject: Case Inquiry - Asylee Adjustment of Status (Receipt Number [Insert Number])
          Dear USCIS Officer,
          I am requesting an update on my Form I-485, which has been pending for over [number] months. As an asylee, I understand that background checks take time, but my case is now well outside the published processing times. Could you please advise if there is any further documentation I can provide to assist in concluding the review of my application?
          Sincerely,
          [Your Name]
    prevention_suggestions:
      - "Ensure you have not engaged in any conduct that would make you removable or trigger inadmissibility."
      - "Do not travel outside the U.S. without first obtaining a Refugee Travel Document, as doing so might risk your status."
    can_file_concurrently: "Not applicable. The status (asylee/refugee) must be held for 1 year before filing the I-485."
    common_waivers_needed: "Form I-602 (Application by Refugee for Waiver of Inadmissibility Grounds) for medical, criminal, or other grounds of inadmissibility. This waiver is much broader and more forgiving than the I-601."
    interview_preparation:
      - "The I-485 interview for asylees often revisits the original asylum claim; review your complete I-589 asylum application before the interview and be fully consistent in all factual details — any discrepancy will be noted."
      - "Bring the original asylum approval notice (or immigration judge's order), all passports including expired ones, your I-94, and a chronological log of all travel outside the U.S. since being granted status."
      - "Be prepared to explain any international travel, especially travel that was close to your home country; the officer will probe whether conditions changed or whether the trip undermines your fear of persecution."
      - "Stay informed about current country conditions in your home country — officers sometimes ask about recent developments to assess whether the fear of persecution remains valid."
    acceleration_tips:
      - "File the I-485 exactly on the one-year anniversary of your grant of asylum or refugee admission — every month of delay adds unnecessary time to an already lengthy queue."
      - "Submit Form I-602 (waiver of inadmissibility) proactively if you are aware of any potential inadmissibility grounds; waiting for USCIS to issue an RFE adds 3–6 months."
      - "Asylees: File a fee waiver (Form I-912) upfront if you cannot afford the $1,440 fee — a rejected filing due to insufficient payment causes a significant restart delay."
      - "If your case has been pending over 2 years with no update, consult an attorney about filing a Writ of Mandamus in federal district court — this has been effective in forcing adjudication of stalled asylee I-485 cases."
    critical_warnings:
      - "NEVER travel to your home country: Returning to the country of feared persecution — even briefly for a family emergency — can be treated as re-availment of that country's protection, which may destroy your refugee or asylee status and make you ineligible for a green card."
      - "Do NOT travel on your home country's passport: Using your home country's passport for international travel can be considered re-availment of that country's protection and put your status at risk. Always use a Refugee Travel Document (Form I-131) for any international travel."
    what_comes_next:
      - "Naturalization: Refugees and asylees can count their time in that status toward naturalization. Refugees may apply after 4 years as a permanent resident (one year of refugee status counts as one year of LPR). Asylees apply after 4 years total (1 year asylee + 3 years LPR). File Form N-400."
      - "International travel: Always use a Refugee Travel Document (Form I-131), not your home country's passport, for any international travel. Apply for it before your green card is issued."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card for Human Trafficking and Crime Victims"
    simple_description: "If you are a victim of trafficking or certain crimes and you helped law enforcement, you may be able to get a green card."
    explanation: "This category allows individuals who have been granted T nonimmigrant status (trafficking victims) or U nonimmigrant status (crime victims) to adjust to permanent resident status. These pathways are designed to protect vulnerable individuals who have cooperated with U.S. law enforcement. It requires continuous physical presence in the U.S. for a specified period."
    applicants:
      - who_you_can_apply_as: "Human trafficking victim"
        who_you_need_to_be: "Someone who currently has a T visa (given to victims of human trafficking)"
      - who_you_can_apply_as: "Crime victim"
        who_you_need_to_be: "Someone who currently has a U visa (given to victims of certain crimes who helped police or prosecutors)"
    target_timeline: "1.5 to 2.5 years after filing the adjustment application. The wait for the underlying U visa currently exceeds 5+ years."
    attorney_required_tasks:
      - "Interfacing with and applying formal legal leverage to police chiefs, federal agents, or prosecutors who refuse to execute updated cooperation verifications."
      - "Analyzing complex 'good moral character' shortfalls to ensure minor infractions do not lead directly into active removal proceedings."
    independent_sequential_checklist:
      - step: 1
        task: "Reach out to the initial law enforcement division to request an official verification letter confirming ongoing cooperation stance."
        form_link: "N/A"
        timeline_notes: "Initiate 3–4 months prior to reaching the 3-year continuous presence point."
      - step: 2
        task: "Request local certified police clearance records for every jurisdiction where you have resided over the past 3 years."
        form_link: "N/A"
        timeline_notes: "Takes 2–3 weeks to systematically secure."
      - step: 3
        task: "Compile formal housing and income records (leases, pay stubs, utilities) tracking every consecutive month of the 3-year timeline."
        form_link: "N/A"
        timeline_notes: "Dedicate 1–2 weeks to establish an orderly data folder."
      - step: 4
        task: "Complete Form I-485 along with Form I-912 to cleanly request an entry fee waiver."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Submit precisely on the 3-year anniversary window."
    steps:
      - "Step 1: Hold valid T or U nonimmigrant status and meet the physical presence requirement (usually 3 years)."
      - "Step 2: File Form I-485, Adjustment of Status."
      - "Step 3: Provide evidence of ongoing cooperation with law enforcement (for U visa) or compliance with assistance requests (for T visa)."
      - "Step 4: Provide evidence of good moral character."
    action_items:
      - "Obtain a newly signed certification or letter from the certifying law enforcement agency confirming ongoing cooperation."
      - "Gather affidavits and evidence demonstrating continuous physical presence in the U.S."
      - "Request a fee waiver (Form I-912) as most U and T adjusters are eligible to waive the I-485 fee."
    country_specific_info: "No country-specific caps apply, but the overall statutory limit of 10,000 U visas per year causes massive backlogs at the initial nonimmigrant stage."
    communication_templates:
      - recipient: "Law Enforcement Agency/Prosecutor"
        when_to_send: "3-4 months prior to filing the I-485 application."
        template: |
          Subject: Request for Confirmation of Cooperation for U-Visa Adjustment
          Dear [Officer/Prosecutor Name],
          I was previously granted a U-visa based on my assistance in case [Case Number]. I am preparing to apply for my Green Card and kindly request a brief letter confirming that I have not unreasonably refused to provide assistance in the criminal investigation or prosecution since the issuance of my U-visa. 
          Thank you for your ongoing support.
          Sincerely,
          [Your Name]
    prevention_suggestions:
      - "Never depart the United States without explicit authorization (Advance Parole) while in U or T status, as it breaks the continuous physical presence requirement."
      - "Compile extensive tax and police records to affirmatively prove good moral character."
    can_file_concurrently: "Not applicable. The U or T status must be held for the required physical presence period (typically 3 years) before filing the I-485."
    common_waivers_needed: "Form I-192 (Application for Advance Permission to Enter as a Nonimmigrant) is filed during the initial U/T stage to waive almost any inadmissibility. Rarely is a waiver needed at the Green Card stage if previously waived."
    interview_preparation:
      - "The I-485 interview for U/T adjusters focuses on the law enforcement cooperation requirement — bring a current certification letter (dated within the last 6 months) from the certifying law enforcement agency."
      - "Be prepared to confirm continued willingness to cooperate with law enforcement in general terms; you do not need to recount traumatic details, but your cooperation stance must be clear and consistent."
      - "Bring all prior USCIS approval notices, your original U or T visa approval, I-94 records, and evidence of 3 years of continuous physical presence organized chronologically (lease agreements, utility bills, employment records, tax transcripts by year)."
    acceleration_tips:
      - "File the I-485 on the exact day you become eligible (3 years of continuous presence) — there is no benefit to waiting."
      - "Request a fee waiver (I-912) from the outset; U and T adjusters almost universally qualify, and this eliminates a common reason for filing rejection."
      - "Maintain active contact with your certifying law enforcement officer throughout the process — an unobtainable certification due to officer turnover or closed cases is the most common delay factor."
      - "File I-765 and I-131 concurrently with the I-485 to maintain uninterrupted work authorization and travel permission during the wait."
    critical_warnings:
      - "U visa 5+ year wait, but interim work authorization is available sooner: The U visa has an annual cap of 10,000 and the current wait exceeds 5 years. However, once USCIS places you on the waiting list, they can issue a 'Bona Fide Determination' (BFD) letter granting deferred action and work authorization within 1–2 years — much sooner than the full U visa. Ask your attorney about BFD immediately after filing."
      - "Do NOT leave the U.S. without advance parole: Any departure from the U.S. while in U or T status — without first obtaining advance parole (Form I-131) — breaks the required 3 years of continuous physical presence and can permanently disqualify you from the green card adjustment."
    what_comes_next:
      - "Petitioning for family: After receiving your green card based on U or T status, you may petition for qualifying family members who also qualify for derivative status."
      - "Naturalization: Apply for U.S. citizenship 5 years after becoming a lawful permanent resident by filing Form N-400."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card for Victims of Abuse (VAWA)"
    simple_description: "If you have been abused or hurt by someone in your family and you are living in the U.S., there may be a way for you to get a green card without your abuser's help."
    explanation: "Under the Violence Against Women Act (VAWA), abused spouses, children, and parents of U.S. citizens or lawful permanent residents can self-petition for a green card. This allows victims to seek safety and independence without the abuser's knowledge. It applies to all genders, despite the name of the act."
    applicants:
      - who_you_can_apply_as: "VAWA self-petitioner (abuse victim)"
        who_you_need_to_be: "An abused husband or wife of a U.S. citizen or green card holder; OR an abused unmarried child (under 21) of a U.S. citizen or green card holder; OR an abused parent of a U.S. citizen"
      - who_you_can_apply_as: "Special Immigrant Juvenile"
        who_you_need_to_be: "A child who was abused, abandoned, or neglected by a parent, and who has been placed under the protection of a court"
      - who_you_can_apply_as: "Abused spouse or child under the Cuban Adjustment Act"
        who_you_need_to_be: "The abused husband, wife, or child of a Cuban person"
      - who_you_can_apply_as: "Abused spouse or child under HRIFA"
        who_you_need_to_be: "The abused husband, wife, or child of a green card holder who got their card through the Haitian Refugee Immigration Fairness Act (HRIFA)"
    target_timeline: "2.5 to 4 years for the I-360 approval, followed by the I-485 process (timeline varies based on visa availability)."
    attorney_required_tasks:
      - "Formulating highly sensitive, confidential filings to block data tracking leaks back to the abuser."
      - "Structuring complex circumstantial or secondary evidence packages when an abuser intentionally destroys core civil items (passports, birth certificates)."
      - "Drafting advanced strategic arguments to establish cross-category equity or extreme hardship parameters."
    independent_sequential_checklist:
      - step: 1
        task: "Secure a completely insulated P.O. Box or designated safe third-party mailing address."
        form_link: "N/A"
        timeline_notes: "Complete on day 1 before any paperwork touches active processing channels."
      - step: 2
        task: "Request official certified copy sheets of domestic violence reports or protective findings from local court clerks."
        form_link: "N/A"
        timeline_notes: "Takes 1–2 weeks to secure safely."
      - step: 3
        task: "Draft a comprehensive, personal personal declaration detailing the relationship and battery events chronologically."
        form_link: "N/A"
        timeline_notes: "Allow 1–2 weeks to edit deliberately and securely."
      - step: 4
        task: "Complete Form I-360 and prepare it for delivery."
        form_link: "https://www.uscis.gov/i-360"
        timeline_notes: "Route solely via the Vermont Service Center to invoke standard statutory confidentiality locks."
    steps:
      - "Step 1: File Form I-360, self-petition, with evidence of the relationship, abuse, and good moral character."
      - "Step 2: Receive a 'Prima Facie' determination, allowing access to certain public benefits."
      - "Step 3: Once the I-360 is approved and a visa is available, file Form I-485 to adjust status."
      - "Step 4: Attend biometrics and an interview (if not waived)."
    action_items:
      - "Establish strict confidentiality protocols; ensure USCIS has a safe mailing address."
      - "Collect police reports, medical records, or psychological evaluations proving extreme cruelty or battery."
      - "Obtain police clearance letters from every place lived in the past 3 years to prove good moral character."
    country_specific_info: "Wait times for the I-485 stage align with family-based priority dates if the abuser is a permanent resident. If the abuser is a U.S. citizen, the visa is immediately available."
    communication_templates:
      - recipient: "Psychologist/Medical Professional"
        when_to_send: "At the beginning of evidence gathering for the I-360 petition."
        template: |
          Subject: Request for VAWA Evaluation
          Dear Dr. [Name],
          I am currently working on an immigration case under the VAWA provisions for victims of domestic abuse. I am reaching out to schedule a psychological evaluation to document the emotional and psychological impact of the extreme cruelty I experienced. Your detailed report will serve as critical evidence for my self-petition.
          Thank you,
          [Your Name]
    prevention_suggestions:
      - "Do not use your home address on any USCIS forms if you still live with or are hiding from the abuser; use a trusted attorney or P.O. Box."
      - "Ensure the evidence of a good faith marriage is exceptionally strong, as USCIS scrutinizes this heavily."
    can_file_concurrently: "Yes, if the abuser is a U.S. Citizen. If the abuser is a Lawful Permanent Resident, concurrent filing is only allowed if the family preference priority date is current."
    common_waivers_needed: "VAWA applicants have special exemptions for unlawful presence and unauthorized work. If waivers are needed for criminal or fraud issues, an I-601 is used with a specialized 'extreme hardship' standard for VAWA self-petitioners."
    interview_preparation:
      - "VAWA I-485 interviews are frequently waived for immediate-relative cases; if one is scheduled, it usually means the officer needs clarification on a specific point — this is not necessarily a signal of denial."
      - "If interviewed, bring the complete police file (reports, protective orders), medical records documenting injuries, and your psychological evaluation — organize these chronologically."
      - "Be prepared to demonstrate the bona fides of the qualifying relationship (marriage or parent-child); bring photos, joint financial records, and any communications that predate the abuse."
      - "You have the legal right to attend the interview without your abuser present. If you believe the abuser may try to appear or interfere, notify USCIS in writing before the interview date."
    acceleration_tips:
      - "File only with the USCIS Vermont Service Center (VSC), which handles all VAWA cases under strict confidentiality — never file at a local field office, as your identity could be exposed."
      - "A detailed, chronological personal declaration is the single most important document in the I-360 package; invest significant time in writing a thorough narrative of the relationship and the abuse."
      - "Once the I-360 is approved and a 'prima facie' determination is issued, apply for public benefits (food, housing assistance) immediately — this establishes a record of lawful activity and demonstrates independence."
      - "If the abuser is a U.S. citizen, file the I-485 concurrently with the I-360 to shave several months off the overall timeline, since no visa number is required."
    critical_warnings:
      - "Vermont Service Center ONLY: All VAWA I-360 self-petitions MUST be filed exclusively with the USCIS Vermont Service Center (VSC). Filing at any other location — including local field offices — may expose your identity to the abuser and lose you the strict confidentiality protections VAWA provides."
      - "Conditional green card — you can file I-751 alone: If your marriage lasted less than 2 years when the green card was approved, you will receive a conditional (2-year) green card. If the marriage ended due to abuse, you CAN file Form I-751 alone with a VAWA waiver — you do NOT need the abuser's cooperation or signature."
    what_comes_next:
      - "Conditional green card holders: If you received a 2-year conditional green card, file Form I-751 alone using the VAWA abuse waiver during the 90-day window before it expires. You do not need your abuser's participation."
      - "Naturalization: If the abuser was a U.S. citizen and you were married, you can apply for naturalization after 3 years as a permanent resident. Otherwise, the standard 5-year wait applies. File Form N-400."
      - "Safety resources: The National Domestic Violence Hotline (1-800-799-7233) and local DV shelters can connect you with legal aid and housing resources throughout the process."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card through Registry"
    simple_description: "If you have lived in the U.S. continuously since before January 1, 1972, you may be able to apply for a green card through the Registry program — even if you entered without permission or stayed longer than your visa allowed."
    explanation: "Registry is an obscure but powerful provision allowing individuals who have been continuously present in the U.S. since before January 1, 1972, to apply for a green card. It is intended for long-term undocumented individuals. Applicants must demonstrate good moral character and not be deportable on certain severe grounds."
    target_timeline: "1 to 2 years, primarily depending on background checks and local field office interview queues."
    attorney_required_tasks:
      - "Performing deep historical immigration and FBI background clearing checks before notifying USCIS of an undocumented presence that dates back past 1972."
      - "Arguing complex interpretation exceptions for old structural removal configurations or historical deportation entries."
    independent_sequential_checklist:
      - step: 1
        task: "Audit personal archives to extract baseline artifacts (school ledgers, tax histories, local records) that establish continuous physical tracking back past January 1, 1972."
        form_link: "N/A"
        timeline_notes: "Allocate 1–3 months for historical record recovery."
      - step: 2
        task: "Request comprehensive state and local police clearance records covering every jurisdiction lived in across multiple decades."
        form_link: "N/A"
        timeline_notes: "Allow 2–4 weeks for administrative returns."
      - step: 3
        task: "Complete Form I-485 directly indicating eligibility path under 'Registry' provisions."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Ensure the processing entry fee ($1,440) is cleanly factored."
    steps:
      - "Step 1: File Form I-485, Adjustment of Status, indicating eligibility under 'Registry'."
      - "Step 2: Submit copious evidence establishing continuous residence since before January 1, 1972."
      - "Step 3: Attend biometrics appointment."
      - "Step 4: Attend an interview with a USCIS officer to review historical evidence."
    action_items:
      - "Gather chronological documentation (rent receipts, tax returns, bank statements, affidavits) for every single year since 1972."
      - "Submit Form I-485 and pay the $1,440 fee."
      - "Obtain police clearances to establish good moral character."
    country_specific_info: "There are no per-country visa limits for Registry applicants. Nationality is largely irrelevant as long as the 1972 cutoff is met."
    communication_templates:
      - recipient: "Historical Employer or Landlord"
        when_to_send: "During the initial phase of gathering 1970s/1980s documentary evidence."
        template: |
          Subject: Request for Affidavit/Records of Residence
          Dear [Name or Institution],
          I am preparing an application for U.S. permanent residency based on my continuous presence in the U.S. since before 1972. I request a sworn affidavit or copies of any archival records you may have confirming my employment/residency with you during the period of [Year] to [Year]. This evidence is crucial for my case.
          Thank you,
          [Your Name]
    prevention_suggestions:
      - "Any prolonged departures from the U.S. can break the 'continuous residence' requirement; prepare to explain any trips outside the U.S."
      - "Do not rely solely on affidavits; objective documentary evidence is vital for older periods."
    can_file_concurrently: "Yes, the I-485 is filed directly as the primary application; there is no underlying petition like an I-130 or I-140."
    common_waivers_needed: "Registry applicants are statutorily exempt from many inadmissibility grounds (like unlawful entry or being a public charge). Criminal waivers (I-601) may be needed for specific offenses not barred by the 'good moral character' requirement."
    interview_preparation:
      - "Registry interviews are always conducted at a local USCIS field office and are highly intensive; the officer will systematically review your physical presence evidence year by year from 1972 through the present."
      - "Organize all evidence chronologically in a binder with tabbed dividers by year — officers respond positively to well-organized, indexed evidence packages and may move through the review more quickly."
      - "Be fully prepared to explain any documentary gaps for specific years; a credible, consistent verbal explanation supported by context (natural disasters, homelessness, etc.) can bridge sparse periods."
      - "Bring all original documents with certified copies — the officer may retain the copies for the file."
    acceleration_tips:
      - "Contact a genealogist, university archivist, or historical society to help locate records from the 1970s and 1980s (census records, city directories, phone books, utility records) that are not easily found on your own."
      - "Obtain affidavits from multiple long-term acquaintances who have known you since before 1972 — the more independent corroborating witnesses, the stronger and less contestable the case."
      - "Monitor USCIS published processing times for all local field offices and file at the one with the shortest interview wait time for your region if you are geographically flexible."
    critical_warnings:
      - "The January 1, 1972 cutoff is absolute: Congress has not updated the Registry date since 1986. There are no exceptions — if your continuous residence began on or after January 1, 1972, you do not qualify."
      - "Extended absence breaks eligibility: Any departure from the U.S. of 6 months or more during the required continuous residence period may be treated as a break. You must be prepared to explain and document every international trip since before 1972."
    what_comes_next:
      - "Naturalization: Apply for U.S. citizenship 5 years after becoming a lawful permanent resident by filing Form N-400."
      - "International travel: You may now travel internationally. Get a re-entry permit (Form I-131) before any trip exceeding 6 months to protect your permanent resident status."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."

  - name: "Green Card through Other Categories"
    simple_description: "A number of special laws and programs give specific groups of people a path to a green card."
    explanation: "This umbrella category includes various specific programs like the Diversity Immigrant Visa Program (Visa Lottery) and the Cuban Adjustment Act. These paths usually depend on the applicant's nationality, specific legislative acts, or luck in a randomized lottery."
    applicants:
      - who_you_can_apply_as: "Liberian Refugee Immigration Fairness (LRIF)"
        who_you_need_to_be: "A person from Liberia who has lived continuously in the U.S. since at least November 20, 2014; OR the husband, wife, or child of such a person"
      - who_you_can_apply_as: "Diversity Immigrant Visa (DV Lottery)"
        who_you_need_to_be: "Someone who was selected in the U.S. government's annual green card lottery (open to people from countries that send few immigrants to the U.S.)"
      - who_you_can_apply_as: "Cuban Adjustment Act"
        who_you_need_to_be: "A person who was born in Cuba or is a Cuban citizen; OR the husband, wife, or child of such a person"
      - who_you_can_apply_as: "Abused spouse or child under the Cuban Adjustment Act"
        who_you_need_to_be: "The abused husband, wife, or child of a Cuban person"
      - who_you_can_apply_as: "Dependent under HRIFA"
        who_you_need_to_be: "The husband, wife, or child of a green card holder who got their card through the Haitian Refugee Immigration Fairness Act (HRIFA)"
      - who_you_can_apply_as: "Abused spouse or child under HRIFA"
        who_you_need_to_be: "The abused husband, wife, or child of a green card holder who got their card through HRIFA"
      - who_you_can_apply_as: "Lautenberg parolee"
        who_you_need_to_be: "Someone who was let into the U.S. as a Lautenberg parolee (a special program for certain religious minorities from the former Soviet Union and Southeast Asia)"
      - who_you_can_apply_as: "Indochinese Parole Adjustment Act of 2000"
        who_you_need_to_be: "A person from Vietnam, Cambodia, or Laos who was let into the U.S. before October 1, 1997, through a refugee or resettlement program"
      - who_you_can_apply_as: "American Indian born in Canada"
        who_you_need_to_be: "A person born in Canada who has at least 50% American Indian ancestry and whose main home is in the U.S."
      - who_you_can_apply_as: "Person born in the U.S. to a foreign diplomat"
        who_you_need_to_be: "Someone born in the U.S. whose parent was a foreign diplomat assigned to the U.S. at the time of birth"
      - who_you_can_apply_as: "Section 13 — diplomat unable to return home"
        who_you_need_to_be: "A foreign diplomat or high-ranking official who was stationed in the U.S. and cannot safely return to their home country"
    target_timeline: "Varies widely. Diversity Visas must be processed within the fiscal year (fast). Others take 1-3 years."
    attorney_required_tasks:
      - "Evaluating cross-chargeability or complex educational equivalence profiles for Diversity Visa lottery winners."
      - "Handling advanced inadmissibility challenges triggered by historical public charge evaluations or brief, undocumented departures."
    independent_sequential_checklist:
      - step: 1
        task: "Check the official Electronic Diversity Visa portal using your unique confirmation code to verify selection status."
        form_link: "https://dvprogram.state.gov/"
        timeline_notes: "Audit tracking portals immediately when results drop in early May."
      - step: 2
        task: "Complete and submit Form DS-260 online if you are a lottery winner currently processing outside the United States."
        form_link: "https://ceac.state.gov/"
        timeline_notes: "File immediately upon selection; any delay can crash into the absolute September 30 seasonal cut-off."
      - step: 3
        task: "For Cuban Adjustment, pull official tracking records to verify 1 solid year of continuous physical presence following a recorded admission or parole window."
        form_link: "https://i94.cbp.dhs.gov/"
        timeline_notes: "Can be processed and submitted precisely on day 366."
      - step: 4
        task: "File Form I-485 Adjustment packet along with all foundational civil identity records."
        form_link: "https://www.uscis.gov/i-485"
        timeline_notes: "Verify the rank tier boundaries before submitting the packet."
    steps:
      - "Step 1: Establish eligibility under the specific sub-category (e.g., winning the DV lottery or being a Cuban native)."
      - "Step 2: File Form I-485 (if in the U.S.) or pursue Consular Processing (if outside)."
      - "Step 3: Attend biometrics and/or medical examinations."
      - "Step 4: Complete the green card interview."
    action_items:
      - "Diversity Visa: Must rapidly submit DS-260 and track visa bulletin, as the visa must be issued before September 30 of that fiscal year."
      - "Cuban Adjustment: Must prove one year of physical presence after a lawful admission or parole into the U.S."
      - "Pay associated category-specific fees."
    country_specific_info: "Diversity Visas are only available to countries with historically low rates of immigration to the U.S. (excluding countries like India, China, Mexico)."
    communication_templates:
      - recipient: "Kentucky Consular Center (KCC) - For Diversity Visa"
        when_to_send: "If you submitted the DS-260 and your lottery rank number is current, but you haven't received an interview notice."
        template: |
          Subject: Inquiry Regarding DV Interview Scheduling - Case Number [Insert Case Number]
          Dear KCC,
          I am a Diversity Visa selectee for Fiscal Year [Year]. My case number is [Case Number]. According to the recent Visa Bulletin, my number is current. I submitted my DS-260 on [Date]. Due to the strict September 30 deadline for visa issuance, I am inquiring if my case is ready to be scheduled for an interview.
          Sincerely,
          [Your Name]
    prevention_suggestions:
      - "For Diversity Visas, time is of the essence; failing to finalize the process by September 30 results in total forfeiture of the green card."
      - "Under the Cuban Adjustment Act, ensure that your initial entry was fully documented as a valid 'admission or parole'."
    can_file_concurrently: "Yes, for Diversity Visa winners, the I-485 can be filed immediately once the rank number is current. For Cuban Adjustment, the I-485 is filed directly after 1 year of physical presence."
    common_waivers_needed: "Standard I-601 or I-601A waivers apply, depending on the specific path. Diversity Visa applicants are strictly scrutinized and often require waivers for prior misrepresentations or unlawful presence if attempting to adjust."
    interview_preparation:
      - "Diversity Visa interviews at U.S. embassies are thorough; bring originals of every educational credential and employment record listed in your DS-260, along with police certificates from every country you have lived in."
      - "Cuban Adjustment Act interviews focus on the date and manner of your entry into the U.S. — ensure your I-94, parole documentation, or port-of-entry record precisely matches what is stated in your I-485."
      - "For DV Lottery winners, be prepared to prove that you met the education or work experience requirement at the time you registered for the lottery — not just at the time of the interview; USCIS checks registration-date eligibility."
    acceleration_tips:
      - "Diversity Visa winners: Submit the DS-260 online the moment your case is logged in the CEAC system — every week of delay risks missing the non-negotiable September 30 fiscal-year deadline."
      - "Monitor the monthly Visa Bulletin DV cut-off numbers closely; the Kentucky Consular Center (KCC) only schedules interviews for cases whose rank number falls within the current month's published cut-off."
      - "Cuban Adjustment Act applicants should file the I-485 immediately upon completing one year of physical presence — there is no benefit to waiting, and earlier filing means earlier priority in the queue."
      - "DV winners present in the U.S. in valid status should evaluate filing an I-485 (Adjustment of Status) rather than consular processing — this eliminates the risk of a consular denial and is generally faster."
    critical_warnings:
      - "DV Lottery September 30 deadline is absolute: If your Diversity Visa is not issued by September 30 of the fiscal year you were selected, your selection expires permanently — there is no extension, no appeal, and no rollover to the next year. Every week of delay in submitting documents genuinely risks losing the visa."
      - "DV Lottery misrepresentation is permanent: Any misrepresentation on the original DV lottery entry (wrong country of birth, wrong education level, omitting a family member) can result in permanent inadmissibility and potential criminal charges — the original entry information cannot be changed after submission."
    what_comes_next:
      - "Naturalization: Apply for U.S. citizenship 5 years after your green card was granted by filing Form N-400."
      - "Re-entry permit: Apply for a re-entry permit (Form I-131) before any international trip exceeding 6 months to protect your permanent resident status."
      - "Green card renewal: Your green card must be renewed every 10 years using Form I-90."